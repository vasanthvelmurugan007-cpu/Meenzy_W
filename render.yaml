databases:
  # -------------------------
  # 1. PostgreSQL Database
  # -------------------------
  - name: meenzy-db
    databaseName: meenzy
    plan: free

services:
  # -------------------------
  # 2. Redis (for queues/cache)
  # -------------------------
  - type: redis
    name: meenzy-redis
    plan: free
    ipAllowList: []

  # -------------------------
  # 3. Backend (Node.js API)
  # -------------------------
  - type: web
    name: meenzy-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: meenzy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: meenzy-redis
          property: connectionString

  # -------------------------
  # 4. Frontend (Static Site)
  # -------------------------
  - type: web
    name: meenzy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
    routes:
      # Proxy all /api requests to the backend service to avoid CORS issues
      - type: rewrite
        source: /api/*
        destination: https://meenzy-backend.onrender.com/api/*
      # Handle SPA routing (React Router)
      - type: rewrite
        source: /*
        destination: /index.html
